<div style="background-color: ghostwhite">
  <app-navbar (helpClicked3)="openChat(3)"></app-navbar>
  <app-chatbot3
    *ngIf="chatVisible3"
    [hidden]="isMinimized"
    [chatbotEndpoint]="chatbotEndpont"
    [username]="this.username"
    (close)="closeChat3()"
    [userId]="user?._id"
    (minimize)="handleMinimize()"
  ></app-chatbot3>

  <router-outlet></router-outlet>

  <!-- Floating Chatbot Icon -->
  <div
    class="chatbot-launcher"
    (click)="isMinimized ? restoreChat() : toggleChatOptions()"
    *ngIf="!isAnyChatbotOpen() || isMinimized"
  >
    <i class="fas fa-comments"></i>
  </div>

  <!-- Chatbot Options Menu -->
  <div class="chatbot-options" *ngIf="chatOptionsVisible">
    <button (click)="openChat(3)">Chatbot 3.0</button>
  </div>
</div>
